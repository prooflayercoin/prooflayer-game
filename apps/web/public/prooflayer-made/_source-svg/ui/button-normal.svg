<svg xmlns="http://www.w3.org/2000/svg" width="256" height="80" viewBox="0 0 256 80">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <linearGradient id="panelGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3a2514"/>
      <stop offset="1" stop-color="#17100a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset=".45" stop-color="#e0ad4e"/>
      <stop offset="1" stop-color="#8e5a20"/>
    </linearGradient>
    
  </defs>
  
    <rect x="8" y="8" width="240" height="64" rx="10" fill="url(#panelGrad)" stroke="#8d6030" stroke-width="5" filter="url(#shadow)"/>
    <path d="M25 24 H231" stroke="#ffe28a" stroke-width="2" opacity=".32"/>
    <text x="128" y="50" text-anchor="middle" font-family="Trebuchet MS, Arial" font-size="22" font-weight="700" fill="#f7e6bd">Button</text>
</svg>