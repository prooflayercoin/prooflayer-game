<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <linearGradient id="panelGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3a2514"/>
      <stop offset="1" stop-color="#17100a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset=".45" stop-color="#e0ad4e"/>
      <stop offset="1" stop-color="#8e5a20"/>
    </linearGradient>
    
  </defs>
  
  <rect x="6" y="6" width="116" height="116" rx="14" fill="url(#panelGrad)" stroke="#8d6030" stroke-width="4" filter="url(#shadow)"/>
  <rect x="14" y="14" width="100" height="100" rx="10" fill="#120c07" opacity=".78" stroke="#000" stroke-width="2"/>
  <circle cx="36" cy="30" r="18" fill="#ffe28a" opacity=".12"/>
  <g transform="translate(0 0)">
    <path d="M30 82 L47 50 L70 44 L96 69 L86 93 L55 101 Z" fill="#bd6938" stroke="#3b2214" stroke-width="5"/>
    <path d="M47 50 L61 78 L70 44" fill="#e19955" opacity=".65"/>
    <circle cx="72" cy="70" r="8" fill="#ffd28a" opacity=".5"/>
  </g>
</svg>